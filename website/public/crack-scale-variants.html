<!doctype html><html lang="ru"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ANDRII — 20 вариантов: масштаб взлома</title>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#efe6d2;--paper-light:#f6efe0;--paper-card:#fbf7ec;--ink:#2b2016;--ink-soft:#6a5a45;--ink-faint:#93805f;--brown:#7a4a23;--wax:#8f2f24;--gold:#cb9d5b;--ok:#3f7d46;--line:rgba(70,50,30,.16);--line-strong:rgba(70,50,30,.26);--display:"PT Serif",Georgia,serif;--sans:Inter,system-ui,sans-serif;--sh:0 14px 32px rgba(43,28,12,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.ph{padding:46px 0 6px;text-align:center}.ph h1{font-family:var(--display);font-size:1.9rem;margin:0}.ph p{color:var(--ink-soft);margin:8px auto 0;max-width:66ch}
.toc{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:18px auto 0}.toc a{font-size:.8rem;color:var(--brown);border:1px solid var(--line-strong);border-radius:999px;padding:5px 11px;text-decoration:none;background:var(--paper-card)}
.variant{padding:42px 0;border-top:1px solid var(--line)}.variant:nth-child(even){background:var(--paper-light)}
.vh{display:flex;gap:14px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.vn{font-family:var(--display);font-weight:700;color:var(--brown);background:var(--paper-card);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center}
.vt{font-family:var(--display);font-size:1.18rem;margin:0}.vd{color:var(--ink-soft);font-size:.88rem;margin:0;flex:1 1 260px}
.note{color:var(--ink-faint);font-size:.78rem;margin:14px 0 0}
b,p,h2{margin:0}
.lg{display:inline-grid;place-items:center;border-radius:6px;overflow:hidden;vertical-align:middle;box-shadow:0 1px 3px rgba(43,28,12,.2);flex:0 0 auto}
.lg img{width:84%;height:84%;object-fit:contain}
.tname{display:inline-flex;align-items:center;gap:7px}
.stage{margin-top:26px}
.me-c{color:var(--wax)}
.cap{font-size:.8rem;color:var(--ink-soft)}.cap b{color:var(--brown)}
@media(max-width:760px){.row3{grid-template-columns:1fr!important}}
</style></head><body>
<header class="ph wrap"><h1>Масштаб взлома — 20 вариантов</h1><p>Линейный масштаб (настоящие пропорции): 7 лет — это <b>0,5%</b> от стойкости ANDRII, поэтому 7 лет жмётся к старту, а 1441 год занимает всё. Везде с логотипами. Выбери номер.</p><nav class="toc" id="toc"></nav></header>
<main id="app"></main>
<script>
const T=[
 {key:"windows",n:"Windows ZIP",y:0,disp:"мгновенно",inst:1},
 {key:"winzip",n:"WinZip",y:0.0301,disp:"11 дней"},
 {key:"winrar",n:"WinRAR",y:1.73,disp:"≈ 2 года"},
 {key:"sevenzip",n:"7-Zip",y:6.92,disp:"≈ 7 лет"},
 {key:"andrii",n:"ANDRII",y:1441,disp:"1 441 год",me:1},
];
const MAX=1441;
const LGSRC={andrii:"./brand/app-icon.png",winrar:"./brand/winrar.svg",sevenzip:"./brand/sevenzip.svg"};
function lg(t,s=22){const w=(i,bg)=>`<span class="lg" style="width:${s}px;height:${s}px;background:${bg}">${i}</span>`;
 if(t.key==="windows")return w(`<svg viewBox="0 0 24 24" width="${s*.66}" height="${s*.66}"><rect x="1.5" y="1.5" width="9.5" height="9.5" rx="1" fill="#F35325"/><rect x="13" y="1.5" width="9.5" height="9.5" rx="1" fill="#81BC06"/><rect x="1.5" y="13" width="9.5" height="9.5" rx="1" fill="#05A6F0"/><rect x="13" y="13" width="9.5" height="9.5" rx="1" fill="#FFBA08"/></svg>`,"#fff");
 if(t.key==="winzip")return w(`<b style="color:#1f1f1f;font-size:${s*.42}px;font-weight:800">WZ</b>`,"#F7B500");
 return w(`<img src="${LGSRC[t.key]}">`,"#fff");}
const lin=t=>t.inst?0:t.y/MAX*100;          // linear %
const sq=t=>t.inst?0:Math.sqrt(t.y/MAX);     // 0..1 (area metaphors)
const col=t=>t.me?"var(--wax)":t.inst?"#9a8a6f":"#9a7b3a";
const NOTE='<p class="note">Масштаб линейный — это настоящие пропорции времени. Поэтому WinZip/WinRAR/7-Zip почти неразличимы у нуля, а ANDRII занимает всю шкалу.</p>';

const V=[
{n:"Линейные бары",d:"Полоса = реальное время. ANDRII во всю ширину, остальные — крошечные обрубки у старта.",r:()=>`<div class="stage">${T.filter(t=>!t.inst).map(t=>`<div style="display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;margin:8px 0"><span class="tname">${lg(t,22)} ${t.n}</span><div style="height:18px;background:rgba(122,74,35,.1);border-radius:999px;overflow:hidden"><div style="height:100%;width:${Math.max(lin(t),0.6)}%;background:${col(t)};border-radius:999px"></div></div><b style="white-space:nowrap;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b></div>`).join("")}</div>`+NOTE},

{n:"Бары + лупа на старт",d:"Те же линейные бары, плюс врезка-зум первых 1%, где видно мелкие инструменты.",r:()=>{const small=T.filter(t=>!t.inst&&!t.me);return `<div class="stage">${T.filter(t=>!t.inst).map(t=>`<div style="display:grid;grid-template-columns:140px 1fr auto;gap:12px;align-items:center;margin:7px 0"><span class="tname">${lg(t,20)} ${t.n}</span><div style="height:16px;background:rgba(122,74,35,.1);border-radius:999px;overflow:hidden"><div style="height:100%;width:${Math.max(lin(t),0.6)}%;background:${col(t)}"></div></div><b style="white-space:nowrap">${t.disp}</b></div>`).join("")}
 <div style="margin-top:18px;border:1px dashed var(--line-strong);border-radius:12px;padding:14px 16px;background:var(--paper-card)"><div class="cap" style="margin-bottom:8px">🔍 Зум на первые проценты (где ANDRII ещё даже не начался):</div>${small.map(t=>`<div style="display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;margin:5px 0"><span class="tname">${lg(t,18)} ${t.n}</span><div style="height:12px;background:rgba(122,74,35,.1);border-radius:999px;overflow:hidden"><div style="height:100%;width:${t.y/6.92*100}%;background:${col(t)}"></div></div><b style="font-size:.85rem">${t.disp}</b></div>`).join("")}</div></div>`+NOTE}},

{n:"Колонны (высота = время)",d:"Вертикальные столбцы. ANDRII до потолка, остальные — плинтус.",r:()=>`<div class="stage" style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;height:300px;border-bottom:2px solid var(--line-strong)">${T.map(t=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px;text-align:center"><b style="font-size:.82rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b><div style="width:54%;max-width:46px;border-radius:7px 7px 0 0;background:${col(t)};height:${Math.max(lin(t),0.4)}%;min-height:4px"></div><span class="tname" style="justify-content:center;font-size:.72rem">${lg(t,18)}</span><span style="font-size:.72rem;color:var(--ink-soft)">${t.n}</span></div>`).join("")}</div>`+NOTE},

{n:"Обрыв оси",d:"Колонны с «разрывом»: мелкие видны, а столбец ANDRII улетает за обрыв с подписью 1441.",r:()=>`<div class="stage" style="position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:end;height:280px;border-bottom:2px solid var(--line-strong)">${T.map(t=>{const h=t.me?100:Math.min(60,t.y/6.92*60);return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;text-align:center"><b style="font-size:.8rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b><div style="width:52%;max-width:46px;border-radius:7px 7px 0 0;background:${col(t)};height:${Math.max(h,3)}%;min-height:4px;position:relative">${t.me?'<span style="position:absolute;top:-2px;left:-4px;right:-4px;height:14px;background:repeating-linear-gradient(-20deg,var(--paper-light),var(--paper-light) 4px,transparent 4px,transparent 8px)"></span>':''}</div><span class="tname" style="justify-content:center;font-size:.72rem">${lg(t,18)} ${t.n}</span></div>`}).join("")}<div style="position:absolute;left:8px;top:8px;font-size:.72rem;color:var(--ink-faint)">↯ ось разорвана — ANDRII не помещается</div></div>`+NOTE},

{n:"Площади-квадраты",d:"Площадь квадрата = время. У ANDRII огромный квадрат, у 7-Zip — кубик.",r:()=>`<div class="stage" style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap">${T.filter(t=>!t.inst).map(t=>{const s=Math.max(sq(t)*150,10);return `<div style="text-align:center"><div style="width:${s}px;height:${s}px;background:${col(t)};border-radius:8px;display:grid;place-items:center" title="${t.disp}"></div><div class="tname" style="justify-content:center;margin-top:8px;font-size:.74rem">${lg(t,18)} ${t.n}</div><b style="font-size:.78rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b></div>`}).join("")}</div>`+NOTE},

{n:"Круги (площадь = время)",d:"Радиус по √времени: ANDRII — огромный круг, остальные — точки.",r:()=>`<div class="stage" style="display:flex;gap:30px;align-items:center;flex-wrap:wrap">${T.filter(t=>!t.inst).map(t=>{const d=Math.max(sq(t)*260,14);return `<div style="text-align:center"><div style="width:${d}px;height:${d}px;background:${col(t)};border-radius:50%;opacity:.9"></div><div class="tname" style="justify-content:center;margin-top:8px;font-size:.74rem">${lg(t,18)} ${t.n}</div><b style="font-size:.78rem">${t.disp}</b></div>`}).join("")}</div>`+NOTE},

{n:"Небоскрёб",d:"Башни с этажами: ANDRII — небоскрёб, остальные — будки.",r:()=>`<div class="stage" style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;height:320px;background:linear-gradient(180deg,#cfe0e8,#eef0e4);border-radius:12px;padding:16px;border-bottom:3px solid #8a6a45">${T.map(t=>{const h=Math.max(lin(t),1.4);return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px"><b style="font-size:.76rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b><div style="width:60%;max-width:50px;height:${h}%;min-height:10px;background:${col(t)};background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.18),rgba(255,255,255,.18) 2px,transparent 2px,transparent 12px);border-radius:3px 3px 0 0"></div>${lg(t,18)}<span style="font-size:.7rem;color:var(--ink-soft)">${t.n}</span></div>`}).join("")}</div>`+NOTE},

{n:"Стопка блоков (1 блок = 100 лет)",d:"Каждый блок — 100 лет. ANDRII — башня из ~14 блоков, у остальных и одного нет.",r:()=>`<div class="stage" style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;height:330px;border-bottom:2px solid var(--line-strong)">${T.map(t=>{const b=t.inst?0:t.y/100;const full=Math.floor(b);const frac=b-full;return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px"><b style="font-size:.76rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b><div style="display:flex;flex-direction:column-reverse;gap:3px;width:46px">${frac>0.02?`<div style="height:${frac*20}px;background:${col(t)};opacity:.5;border-radius:4px"></div>`:''}${Array.from({length:full}).map(()=>`<div style="height:18px;background:${col(t)};border-radius:4px"></div>`).join("")||(b<0.02?'<div style="height:4px;background:'+col(t)+';border-radius:4px"></div>':'')}</div><span class="tname" style="justify-content:center;font-size:.7rem">${lg(t,16)} ${t.n}</span></div>`}).join("")}</div>`+NOTE},

{n:"Термометры",d:"Вертикальная заливка-термометр по линейному времени.",r:()=>`<div class="stage" style="display:grid;grid-template-columns:repeat(5,1fr);gap:18px;align-items:end;height:300px">${T.map(t=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px"><b style="font-size:.76rem">${t.disp}</b><div style="width:20px;height:88%;background:rgba(122,74,35,.1);border-radius:999px;position:relative;overflow:hidden;border:2px solid var(--line-strong)"><div style="position:absolute;bottom:0;left:0;right:0;height:${Math.max(lin(t),1)}%;background:${col(t)}"></div></div>${lg(t,18)}<span style="font-size:.7rem;color:var(--ink-soft)">${t.n}</span></div>`).join("")}</div>`+NOTE},

{n:"Дистанция: Земля → Луна",d:"Линейная дистанция: остальные топчутся у Земли, ANDRII улетает к Луне.",r:()=>`<div class="stage" style="position:relative;height:120px;background:linear-gradient(90deg,#26345e,#0b1026);border-radius:12px;overflow:hidden">${Array.from({length:30}).map((_,i)=>`<span style="position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;left:${(i*53)%100}%;top:${(i*37)%90}%;opacity:.6"></span>`).join("")}<span style="position:absolute;left:1%;bottom:8px;font-size:1.6rem">🌍</span><span style="position:absolute;right:1%;top:10px;font-size:1.6rem">🌕</span>${T.filter(t=>!t.inst).map(t=>`<div style="position:absolute;left:${Math.max(lin(t),1)}%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;font-size:.7rem;white-space:nowrap">${lg(t,20)}<div style="margin-top:2px;text-shadow:0 1px 3px #000">${t.disp}</div></div>`).join("")}</div><p class="cap" style="margin-top:8px"><b>7 лет</b> — это ещё на стартовой орбите; ANDRII — у Луны.</p>`+NOTE},

{n:"Гоночный трек (ANDRII за кадром)",d:"Линейный трек: соперники сгрудились на старте, ANDRII уехал за правый край.",r:()=>`<div class="stage" style="position:relative;background:repeating-linear-gradient(90deg,#3a2c1d,#3a2c1d 38px,#34271a 38px,#34271a 76px);border-radius:12px;padding:14px 0;overflow:hidden">${T.filter(t=>!t.inst&&!t.me).map((t,i)=>`<div style="position:relative;height:40px"><span style="position:absolute;left:${Math.max(lin(t),2)}%;top:50%;transform:translate(-50%,-50%);font-size:1.4rem">🚗</span><span style="position:absolute;left:${Math.max(lin(t),2)}%;top:50%;transform:translate(-50%,-50%);margin-top:-20px;color:#fff;font-size:.68rem;white-space:nowrap;text-shadow:0 1px 2px #000">${t.n} · ${t.disp}</span></div>`).join("")}<div style="position:relative;height:40px"><span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:1.4rem">🏎️💨</span><span style="position:absolute;right:46px;top:50%;transform:translateY(-50%);color:#ffd9a0;font-size:.72rem;white-space:nowrap;text-shadow:0 1px 2px #000">ANDRII → ещё 1400+ лет вперёд</span></div></div>`+NOTE},

{n:"Айсберг",d:"Размер айсберга = время. У ANDRII — гора, у остальных — льдинки.",r:()=>`<div class="stage" style="position:relative;height:300px;background:linear-gradient(180deg,#bfe0ea 55%,#2f6f86 55%,#16384a);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:space-around">${T.filter(t=>!t.inst).map(t=>{const s=Math.max(sq(t)*200,16);return `<div style="text-align:center;z-index:1"><div style="width:0;height:0;border-left:${s*.6}px solid transparent;border-right:${s*.6}px solid transparent;border-bottom:${s}px solid ${t.me?'#eef6fa':'#dbeaf0'};margin:0 auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))"></div><div class="tname" style="justify-content:center;margin-top:6px;font-size:.72rem;color:#0c2a38">${lg(t,16)} ${t.n}</div><b style="font-size:.74rem;color:#0c2a38">${t.disp}</b></div>`}).join("")}</div>`+NOTE},

{n:"Лестница в небо",d:"Ступени-высота: до уровня ANDRII надо лезть и лезть.",r:()=>`<div class="stage" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:300px;border-bottom:2px solid var(--line-strong)">${T.slice().sort((a,b)=>a.y-b.y).map(t=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px"><b style="font-size:.74rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b><div style="width:100%;height:${Math.max(lin(t),2)}%;min-height:14px;background:${col(t)};border-radius:6px 6px 0 0;display:grid;place-items:center;padding-top:4px">${lg(t,18)}</div><span style="font-size:.7rem;color:var(--ink-soft)">${t.n}</span></div>`).join("")}</div>`+NOTE},

{n:"Рост (деревья)",d:"Высота «дерева» = время. ANDRII — вековой дуб, остальные — ростки.",r:()=>`<div class="stage" style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;height:300px;background:linear-gradient(180deg,#eaf3e0,#dceccf);border-radius:12px;padding:14px;border-bottom:4px solid #6b4a2b">${T.map(t=>{const h=Math.max(lin(t),2);return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px"><b style="font-size:.74rem">${t.disp}</b><div style="width:8px;height:${h}%;min-height:10px;background:#6b4a2b;position:relative"><div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:${Math.max(h*.5,14)}px;height:${Math.max(h*.5,14)}px;background:${t.me?'#3f7d46':'#5a9a52'};border-radius:50%"></div></div>${lg(t,16)}<span style="font-size:.68rem;color:var(--ink-soft)">${t.n}</span></div>`}).join("")}</div>`+NOTE},

{n:"Песочные часы",d:"Объём песка = время. У ANDRII колба полна, у остальных — пара крупинок.",r:()=>`<div class="stage" style="display:flex;gap:24px;justify-content:space-around;flex-wrap:wrap">${T.filter(t=>!t.inst).map(t=>`<div style="text-align:center"><div style="width:60px;height:90px;position:relative;margin:0 auto;border:2px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--paper-card)"><div style="position:absolute;bottom:0;left:0;right:0;height:${Math.max(lin(t),2)}%;background:${col(t)}"></div></div><div class="tname" style="justify-content:center;margin-top:8px;font-size:.74rem">${lg(t,18)} ${t.n}</div><b style="font-size:.76rem">${t.disp}</b></div>`).join("")}</div>`+NOTE},

{n:"Баки с водой",d:"Уровень воды = время. ANDRII полный, остальные — на донышке.",r:()=>`<div class="stage" style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:end;height:280px">${T.map(t=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px"><b style="font-size:.74rem">${t.disp}</b><div style="width:100%;max-width:70px;height:90%;border:2px solid var(--line-strong);border-radius:0 0 10px 10px;border-top:0;position:relative;overflow:hidden;background:var(--paper-card)"><div style="position:absolute;bottom:0;left:0;right:0;height:${Math.max(lin(t),1.5)}%;background:linear-gradient(180deg,#4a90b8,#2f6f86)"></div></div><span class="tname" style="justify-content:center;font-size:.7rem">${lg(t,16)} ${t.n}</span></div>`).join("")}</div>`+NOTE},

{n:"Тепловая шкала",d:"Линейная полоса «уязвимо→надёжно»; метки времени с логотипами.",r:()=>`<div class="stage"><div style="position:relative;height:40px;border-radius:999px;background:linear-gradient(90deg,#8f2f24,#d6a64e 8%,#3f7d46)">${T.filter(t=>!t.inst).map(t=>`<div style="position:absolute;left:${Math.max(lin(t),1)}%;top:-46px;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:.7rem">${lg(t,18)}<br><b style="color:${t.me?'var(--wax)':'var(--brown)'}">${t.disp}</b></div>`).join("")}</div></div>`+NOTE},

{n:"Линейка с делениями",d:"Линейка 0…1441 год. Все, кроме ANDRII, прижаты к нулю.",r:()=>`<div class="stage"><div style="position:relative;height:30px;border-bottom:2px solid var(--ink)">${[0,250,500,750,1000,1250,1441].map(v=>`<div style="position:absolute;left:${v/MAX*100}%;bottom:0;width:1px;height:10px;background:var(--ink-faint)"></div><div style="position:absolute;left:${v/MAX*100}%;top:12px;transform:translateX(-50%);font-size:.66rem;color:var(--ink-faint)">${v}</div>`).join("")}${T.filter(t=>!t.inst).map(t=>`<div style="position:absolute;left:${Math.max(lin(t),0.4)}%;bottom:14px;transform:translateX(-50%);text-align:center;white-space:nowrap">${lg(t,18)}<div style="font-size:.66rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</div></div>`).join("")}</div></div><p class="cap" style="margin-top:30px">Засечки — годы. WinZip/WinRAR/7-Zip сливаются в точку у нуля.</p>`+NOTE},

{n:"Радиальные дуги",d:"Дуга-заполнение по линейному времени: ANDRII — почти полный круг, остальные — чёрточка.",r:()=>`<div class="stage" style="display:flex;gap:26px;justify-content:space-around;flex-wrap:wrap">${T.filter(t=>!t.inst).map(t=>{const deg=Math.max(lin(t)*3.6,3);return `<div style="text-align:center"><div style="width:96px;height:96px;border-radius:50%;background:conic-gradient(${col(t)} ${deg}deg, rgba(122,74,35,.12) 0);display:grid;place-items:center;margin:0 auto"><div style="width:64px;height:64px;border-radius:50%;background:var(--paper);display:grid;place-items:center">${lg(t,26)}</div></div><div style="margin-top:8px;font-size:.74rem">${t.n}</div><b style="font-size:.78rem;color:${t.me?'var(--wax)':'var(--ink)'}">${t.disp}</b></div>`}).join("")}</div>`+NOTE},

{n:"Гигантская цифра",d:"Минимал: ANDRII — огромным шрифтом, остальные — мелкой строкой под ним.",r:()=>`<div class="stage" style="text-align:center"><div class="tname" style="justify-content:center;margin-bottom:6px">${lg(T[4],40)}</div><div style="font-family:var(--display);font-size:clamp(3rem,9vw,6rem);color:var(--wax);line-height:1">1 441 год</div><div class="cap" style="margin-bottom:18px">столько ломать пароль к ANDRII</div><div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px">${T.filter(t=>!t.inst&&!t.me).map(t=>`<span class="tname" style="font-size:.82rem;color:var(--ink-soft)">${lg(t,18)} ${t.n}: <b style="color:var(--ink)">${t.disp}</b></span>`).join("")}</div></div>`+NOTE},

{n:"Башня ANDRII — в разы выше",d:"Высоты в НАСТОЯЩИХ пропорциях: столбик ANDRII в ~200 раз выше, чем у 7-Zip. Соперники остаются у самого пола, а ANDRII уходит далеко вверх — буквально «дохуища».",r:()=>`<div class="stage" style="display:flex;gap:22px;align-items:flex-end;justify-content:center;height:780px;border-bottom:2px solid var(--line-strong);position:relative">`+T.map(t=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px"><b style="font-size:.78rem;color:${t.me?'var(--wax)':'var(--ink)'};white-space:nowrap">${t.disp}</b><div style="width:54px;height:${t.me?740:Math.max(t.y/MAX*740,6)}px;background:${t.me?'linear-gradient(180deg,var(--wax),#6f211a)':col(t)};border-radius:7px 7px 0 0;box-shadow:${t.me?'0 0 28px rgba(143,47,36,.3)':'none'}"></div><span class="tname" style="justify-content:center;font-size:.72rem;text-align:center">${lg(t,18)} ${t.n}</span></div>`).join("")+`<div style="position:absolute;left:14px;bottom:60px;font-size:.74rem;color:var(--ink-faint);max-width:150px">↑ 7-Zip отсюда — всего <b>3,5 пикселя</b> (7 лет). ANDRII — вся эта высота.</div></div>`+`<p class="note">Это честная линейная высота: 1441 год против 7 лет — разница ~×200, поэтому ANDRII уходит вверх, а остальные сливаются у нуля.</p>`},
];
const app=document.getElementById("app"),toc=document.getElementById("toc");
V.forEach((v,i)=>{const n=i+1;toc.insertAdjacentHTML("beforeend",`<a href="#v${n}">${n}. ${v.n}</a>`);const s=document.createElement("section");s.className="variant";s.id="v"+n;s.innerHTML=`<div class="wrap"><div class="vh"><div class="vn">${n}</div><div><h2 class="vt">${v.n}</h2><p class="vd">${v.d}</p></div></div>${v.r()}</div>`;app.appendChild(s);});
</script></body></html>
