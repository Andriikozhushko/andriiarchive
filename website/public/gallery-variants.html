<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ANDRII — 10 вариантов галереи скриншотов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper-light:#f6efe0; --paper:#efe6d2; --paper-deep:#e8dcc2; --paper-card:#fbf7ec;
    --ink:#2b2016; --ink-soft:#6a5a45; --ink-faint:#93805f;
    --brown:#7a4a23; --brown-dark:#5b3415; --wax:#8f2f24; --line:rgba(70,50,30,.16); --line-strong:rgba(70,50,30,.26);
    --display:"PT Serif",Georgia,serif; --sans:Inter,system-ui,sans-serif;
    --shadow:0 18px 44px rgba(43,28,12,.12);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
  img{max-width:100%;display:block}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px}
  .page-head{padding:54px 0 8px;text-align:center}
  .page-head h1{font-family:var(--display);font-weight:700;font-size:2.2rem;margin:0}
  .page-head p{color:var(--ink-soft);margin:10px auto 0;max-width:60ch}
  .toc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:22px auto 0;max-width:900px}
  .toc a{font-size:.86rem;color:var(--brown);border:1px solid var(--line-strong);border-radius:999px;padding:6px 13px;text-decoration:none;background:var(--paper-card)}
  .toc a:hover{background:#fff}
  .variant{padding:44px 0;border-top:1px solid var(--line)}
  .variant:nth-child(even){background:var(--paper-light)}
  .v-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:24px}
  .v-num{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--brown);background:var(--paper-card);border:1px solid var(--line);border-radius:10px;width:46px;height:46px;display:grid;place-items:center;flex:0 0 auto}
  .v-title{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0}
  .v-desc{color:var(--ink-soft);font-size:.92rem;margin:2px 0 0;flex:1 1 280px}

  /* shared window frame */
  .frame{border-radius:10px;overflow:hidden;border:1px solid var(--line-strong);background:var(--paper-card);box-shadow:var(--shadow)}
  .bar{display:flex;align-items:center;gap:7px;height:30px;padding:0 13px;background:#efe7d6;border-bottom:1px solid var(--line)}
  .bar i{width:8px;height:8px;border-radius:50%;background:rgba(90,64,36,.32)}
  .bar i:nth-child(1){background:#cd6a4d}.bar i:nth-child(2){background:#d6a64e}.bar i:nth-child(3){background:#8a9a55}
  .bar b{margin-left:6px;font-weight:500;font-size:.72rem;color:var(--ink-faint)}
  .frame img{width:100%}

  /* V1 clean grid */
  .v1{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .v1 figure{margin:0}
  .v1 figcaption{padding-top:12px}
  .v1 h4{margin:0;font-size:1.02rem}
  .v1 p{margin:3px 0 0;color:var(--ink-soft);font-size:.88rem}
  .v1 .frame{transition:transform .25s,box-shadow .25s}
  .v1 figure:hover .frame{transform:translateY(-5px);box-shadow:0 26px 54px rgba(43,28,12,.18)}

  /* V2 featured + thumbs */
  .v2{display:grid;grid-template-columns:1fr 168px;gap:20px;align-items:start}
  .v2 .thumbs{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow:auto}
  .v2 .thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--paper-card);opacity:.7;transition:opacity .2s,border-color .2s}
  .v2 .thumb img{width:100%}
  .v2 .thumb.active,.v2 .thumb:hover{opacity:1;border-color:var(--brown)}
  .v2 .cap{padding-top:10px;color:var(--ink-soft);font-size:.9rem}
  .v2 .cap b{color:var(--ink);font-size:1.04rem;display:block;font-family:var(--display)}

  /* V3 carousel */
  .v3-scroll{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
  .v3-scroll figure{margin:0;flex:0 0 340px;scroll-snap-align:start}
  .v3-scroll figcaption{padding-top:10px;font-size:.9rem;color:var(--ink-soft)}
  .v3-scroll figcaption b{display:block;color:var(--ink);font-family:var(--display)}

  /* V4 zigzag */
  .v4 .row{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-bottom:34px}
  .v4 .row:nth-child(even) .txt{order:2}
  .v4 .txt h4{font-family:var(--display);font-size:1.5rem;margin:0}
  .v4 .txt p{color:var(--ink-soft);margin:10px 0 0}
  .v4 .step{display:inline-block;font-size:.78rem;font-weight:700;color:var(--brown);background:rgba(122,74,35,.1);padding:3px 12px;border-radius:999px;margin-bottom:12px}

  /* V5 laptop mockup */
  .v5{max-width:760px;margin:0 auto;text-align:center}
  .laptop{background:#241a12;border-radius:18px 18px 0 0;padding:14px 14px 0;box-shadow:var(--shadow)}
  .laptop .screen{border-radius:8px;overflow:hidden;background:#000}
  .laptop-base{height:16px;background:linear-gradient(#cdbfa6,#a9966f);border-radius:0 0 14px 14px;margin:0 -22px;box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
  .laptop-notch{width:64px;height:5px;background:#3a2c1d;border-radius:0 0 6px 6px;margin:0 auto 8px}
  .v5 .dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
  .v5 .dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line-strong);cursor:pointer}
  .v5 .dots button.active{background:var(--brown)}
  .v5 .cap{margin-top:12px;color:var(--ink-soft)}

  /* V6 tabs */
  .v6{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
  .v6 .tabs{display:flex;flex-direction:column;gap:6px}
  .v6 .tabs button{text-align:left;font:inherit;font-weight:600;color:var(--ink-soft);background:none;border:0;border-left:2px solid var(--line);padding:11px 16px;cursor:pointer;border-radius:0 8px 8px 0}
  .v6 .tabs button.active{color:var(--brown);border-left-color:var(--brown);background:var(--paper-card)}
  .v6 .tabs small{display:block;font-weight:400;font-size:.8rem;color:var(--ink-faint)}

  /* V7 bento */
  .v7{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:16px}
  .v7 figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line-strong);box-shadow:var(--shadow);position:relative}
  .v7 figure img{width:100%;height:100%;object-fit:cover}
  .v7 figure figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 10px;color:#fff;font-weight:600;background:linear-gradient(transparent,rgba(20,12,6,.82))}
  .v7 .big{grid-column:span 2;grid-row:span 2}
  .v7 .wide{grid-column:span 2}

  /* V8 hover caption */
  .v8{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .v8 figure{margin:0;position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line-strong);box-shadow:var(--shadow)}
  .v8 figure img{width:100%;transition:transform .4s}
  .v8 figcaption{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;background:linear-gradient(transparent 45%,rgba(20,12,6,.85));opacity:0;transition:opacity .3s}
  .v8 figure:hover figcaption{opacity:1}
  .v8 figure:hover img{transform:scale(1.05)}
  .v8 figcaption b{font-family:var(--display);font-size:1.1rem}
  .v8 figcaption span{font-size:.86rem;opacity:.9}

  /* V9 tilted stack */
  .v9{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
  .v9 figure{margin:0;transition:transform .3s}
  .v9 figure:nth-child(3n+1){transform:rotate(-2.2deg)}
  .v9 figure:nth-child(3n+2){transform:rotate(1.4deg)}
  .v9 figure:nth-child(3n){transform:rotate(2.6deg)}
  .v9 figure:hover{transform:rotate(0) scale(1.03);z-index:2}
  .v9 .frame{border:6px solid #fff;border-radius:6px;box-shadow:0 16px 34px rgba(43,28,12,.22)}
  .v9 figcaption{text-align:center;padding-top:12px;font-family:var(--display);color:var(--ink-soft)}

  /* V10 full rows */
  .v10 .frow{display:flex;align-items:center;gap:34px;padding:24px 0;border-bottom:1px solid var(--line)}
  .v10 .frow .frame{flex:1 1 60%}
  .v10 .frow .meta{flex:1 1 40%}
  .v10 .frow:nth-child(even){flex-direction:row-reverse}
  .v10 .meta h4{font-family:var(--display);font-size:1.6rem;margin:0}
  .v10 .meta p{color:var(--ink-soft);margin:10px 0 0}
  .v10 .n{font-family:var(--display);color:var(--brown);font-size:2.4rem;line-height:1}

  @media(max-width:820px){
    .v1,.v8,.v9{grid-template-columns:1fr 1fr}
    .v2,.v6{grid-template-columns:1fr}
    .v4 .row,.v10 .frow{grid-template-columns:1fr;flex-direction:column!important}
    .v4 .row:nth-child(even) .txt{order:0}
    .v7{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<header class="page-head wrap">
  <h1>Галерея скриншотов — 10 вариантов</h1>
  <p>Выбери понравившийся вариант (напиши номер), и я внедрю его на сайт вместо текущей секции. Все на реальных скриншотах ANDRII.</p>
  <nav class="toc" id="toc"></nav>
</header>
<main id="app"></main>

<script>
const SHOTS = [
  {img:"./screenshots/create-files.webp", title:"Создание архива",   note:"Добавьте файлы и задайте пароль.",            bar:"ANDRII — Новый архив"},
  {img:"./screenshots/open.webp",         title:"Открытие архива",    note:"Содержимое раскроет только верный пароль.",   bar:"ANDRII — Архив"},
  {img:"./screenshots/verify-intact.webp",title:"Проверка целостности",note:"Видно, если архив повредили или подменили.", bar:"ANDRII — Проверка"},
  {img:"./screenshots/progress.webp",     title:"Запечатывание",      note:"Наглядный прогресс шифрования и сжатия.",     bar:"ANDRII — Запечатывание"},
  {img:"./screenshots/home.webp",         title:"Главный экран",      note:"Чистый старт для нового архива.",             bar:"ANDRII"},
  {img:"./screenshots/sealed.webp",       title:"Архив готов",        note:"Запечатано и готово к хранению.",             bar:"ANDRII — Готово"},
];
const frame = (s)=>`<div class="frame"><div class="bar"><i></i><i></i><i></i><b>${s.bar}</b></div><img src="${s.img}" alt="${s.title}" loading="lazy"></div>`;

const VARIANTS = [
  {id:"v1", name:"Чистая сетка в окнах", desc:"Скриншоты в аккуратных окнах-фреймах, подпись снизу, лёгкий подъём при наведении.", render:()=>`<div class="v1">${SHOTS.map(s=>`<figure>${frame(s)}<figcaption><h4>${s.title}</h4><p>${s.note}</p></figcaption></figure>`).join("")}</div>`},
  {id:"v2", name:"Большой кадр + миниатюры", desc:"Один крупный экран и колонка миниатюр; клик меняет главный кадр.", render:()=>`<div class="v2"><div><div class="frame" id="v2-main"></div><div class="cap" id="v2-cap"></div></div><div class="thumbs" id="v2-thumbs"></div></div>`},
  {id:"v3", name:"Лента с прокруткой", desc:"Горизонтальная карусель со «прилипанием»; компактно и динамично.", render:()=>`<div class="v3-scroll">${SHOTS.map(s=>`<figure>${frame(s)}<figcaption><b>${s.title}</b>${s.note}</figcaption></figure>`).join("")}</div>`},
  {id:"v4", name:"Зигзаг с текстом", desc:"Чередование «картинка ↔ текст», каждый шаг крупно и с пояснением.", render:()=>`<div class="v4">${SHOTS.slice(0,4).map((s,i)=>`<div class="row"><div class="txt"><span class="step">Шаг ${i+1}</span><h4>${s.title}</h4><p>${s.note}</p></div><div>${frame(s)}</div></div>`).join("")}</div>`},
  {id:"v5", name:"Мокап ноутбука", desc:"Один экран в рамке ноутбука с точками-переключателями — премиально и фокусно.", render:()=>`<div class="v5"><div class="laptop"><div class="laptop-notch"></div><div class="screen" id="v5-screen"></div></div><div class="laptop-base"></div><div class="cap" id="v5-cap"></div><div class="dots" id="v5-dots"></div></div>`},
  {id:"v6", name:"Вкладки", desc:"Список экранов слева, превью справа; кликаешь — меняется кадр.", render:()=>`<div class="v6"><div class="tabs" id="v6-tabs"></div><div class="frame" id="v6-view"></div></div>`},
  {id:"v7", name:"Бенто-сетка", desc:"Плитки разного размера с подписью поверх — современно и плотно.", render:()=>`<div class="v7">${SHOTS.map((s,i)=>`<figure class="${i===0?'big':i===3?'wide':''}"><img src="${s.img}" alt="${s.title}" loading="lazy"><figcaption>${s.title}</figcaption></figure>`).join("")}</div>`},
  {id:"v8", name:"Подпись по наведению", desc:"Минимализм: чистые кадры, описание выезжает при наведении, лёгкий зум.", render:()=>`<div class="v8">${SHOTS.map(s=>`<figure><img src="${s.img}" alt="${s.title}" loading="lazy"><figcaption><b>${s.title}</b><span>${s.note}</span></figcaption></figure>`).join("")}</div>`},
  {id:"v9", name:"Стопка с наклоном", desc:"Карточки-полароиды со лёгким наклоном, выравниваются при наведении — «ручной» вайб бренда.", render:()=>`<div class="v9">${SHOTS.map(s=>`<figure>${frame(s)}<figcaption>${s.title}</figcaption></figure>`).join("")}</div>`},
  {id:"v10",name:"Полноширинные строки", desc:"Крупные чередующиеся строки: большой экран и текст — максимум деталей.", render:()=>`<div class="v10">${SHOTS.slice(0,4).map((s,i)=>`<div class="frow">${frame(s)}<div class="meta"><div class="n">0${i+1}</div><h4>${s.title}</h4><p>${s.note}</p></div></div>`).join("")}</div>`},
];

const app=document.getElementById("app"), toc=document.getElementById("toc");
VARIANTS.forEach((v,i)=>{
  const n=i+1;
  toc.insertAdjacentHTML("beforeend",`<a href="#${v.id}">${n}. ${v.name}</a>`);
  const sec=document.createElement("section");
  sec.className="variant"; sec.id=v.id;
  sec.innerHTML=`<div class="wrap"><div class="v-head"><div class="v-num">${n}</div><div><h2 class="v-title">${v.name}</h2><p class="v-desc">${v.desc}</p></div></div>${v.render()}</div>`;
  app.appendChild(sec);
});

// V2 interactivity
(function(){
  const main=document.getElementById("v2-main"), cap=document.getElementById("v2-cap"), th=document.getElementById("v2-thumbs");
  const set=(i)=>{main.innerHTML=frame(SHOTS[i]);cap.innerHTML=`<b>${SHOTS[i].title}</b>${SHOTS[i].note}`;[...th.children].forEach((c,k)=>c.classList.toggle("active",k===i));};
  SHOTS.forEach((s,i)=>{const d=document.createElement("div");d.className="thumb";d.innerHTML=`<img src="${s.img}" alt="">`;d.onclick=()=>set(i);th.appendChild(d);});
  set(0);
})();
// V5 interactivity
(function(){
  const sc=document.getElementById("v5-screen"), cap=document.getElementById("v5-cap"), dots=document.getElementById("v5-dots");
  const set=(i)=>{sc.innerHTML=`<img src="${SHOTS[i].img}" alt="">`;cap.innerHTML=`<b>${SHOTS[i].title}</b> — ${SHOTS[i].note}`;[...dots.children].forEach((c,k)=>c.classList.toggle("active",k===i));};
  SHOTS.forEach((s,i)=>{const b=document.createElement("button");b.onclick=()=>set(i);dots.appendChild(b);});
  set(0);
})();
// V6 interactivity
(function(){
  const tabs=document.getElementById("v6-tabs"), view=document.getElementById("v6-view");
  const set=(i)=>{view.innerHTML=frame(SHOTS[i]);[...tabs.children].forEach((c,k)=>c.classList.toggle("active",k===i));};
  SHOTS.forEach((s,i)=>{const b=document.createElement("button");b.innerHTML=`${s.title}<small>${s.note}</small>`;b.onclick=()=>set(i);tabs.appendChild(b);});
  set(0);
})();
</script>
</body>
</html>
